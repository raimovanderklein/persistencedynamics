<!-- headline -->
<text x="72" y="296" class="g" font-weight="700" font-size="64" fill="var(--ink)">Everything that persists</text>
<text x="72" y="366" class="g" font-weight="700" font-size="64" fill="var(--ink)">runs the same cycle.</text>

<!-- sub -->
<text x="72" y="418" class="g" font-size="20" fill="var(--ink)">Two operations, hold and cross. Four regimes in one forced</text>
<text x="72" y="444" class="g" font-size="20" fill="var(--ink)">order. A single law for how structure lasts, tested from baryon</text>
<text x="72" y="470" class="g" font-size="20" fill="var(--ink)">asymmetry in physics to the immune cycle in cancer.</text>

<!-- cta -->
<text x="72" y="522" class="m" font-size="14" fill="var(--ink)">READ THE PAPER &#8594;</text>
