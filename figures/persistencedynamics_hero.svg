<text x="108" y="61" class="g" font-weight="700" font-size="18" fill="var(--ink)">Persistence Dynamics</text>
<text x="1208" y="61" text-anchor="end" class="m" font-size="13" fill="var(--grey)">PAPER&#160;&#160;&#160;PREDICTIONS&#160;&#160;&#160;METHOD&#160;&#160;&#160;ENCOUNTER</text>
